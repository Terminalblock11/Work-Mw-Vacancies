name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy the app into the desktop project
        shell: bash
        run: |
          mkdir -p desktop/www
          cp www/index.html desktop/www/index.html

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: WorkMw-Vacancies-EXE
          path: |
            desktop/dist/WorkMw-Vacancies-Portable.exe
            desktop/dist/WorkMw-Vacancies-Setup.exe
